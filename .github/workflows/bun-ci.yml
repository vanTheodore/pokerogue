name: Bun CI (SvelteKit host)

# Additive workflow: the upstream pnpm workflows (`linting.yml`, `tests.yml`) stay untouched.
# This job proves that the Bun + SvelteKit path installs, typechecks, tests and builds.
# See docs/MIGRATION-PLAN.md §9.

on:
  push:
    branches:
      - "arena/**"
  pull_request:
    branches:
      - beta
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Bun / typecheck / host tests / builds
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (game)
        run: bun run typecheck

      - name: Typecheck (E2E harness)
        run: bunx tsc -p e2e/tsconfig.json

      - name: Lint (new/changed files)
        run: bunx biome ci src/host src/routes src/main.ts vite.config.ts vite.config.app.ts test/tests/host

      - name: Host boundary tests
        run: bunx vitest run test/tests/host

      - name: Build (legacy MPA pipeline)
        run: bun run build

      - name: Build (SvelteKit host)
        run: bun run build:kit

      - name: Upload SvelteKit build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sveltekit-build
          path: build
          retention-days: 7
