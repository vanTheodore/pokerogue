#
# Commands run through Bun (see docs/MIGRATION-PLAN.md). The upstream pnpm-based CI
# workflows are unaffected: they invoke the scripts directly rather than these hooks.

pre-commit:
  skip:
    - merge
    - rebase
  commands:
    biome-lint:
      # Disable colors as certain IDEs (such as VSCode) don't support it in the output pane.
      # Summary mode looks decent in plain ASCII anyhow
      run: bun run biome:staged --colors=off --reporter=summary
      stage_fixed: true
    ls-lint:
      run: bunx ls-lint

post-merge:
  commands:
    update-submodules:
      run: bun run update-submodules
    update-packages:
      run: bun install

post-checkout:
  commands:
    update-packages:
      # cf https://git-scm.com/docs/githooks#_post_checkout:
      # The 3rd argument is 1 for branch checkouts and 0 for file checkouts.
      run: if test {3} -eq "1"; then bun install; fi
